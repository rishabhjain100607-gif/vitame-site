<body>
  <main id="main">
    <!-- list view -->
    <div data-view="list">
      <section class="sub-hero od-hero">
        <div class="container">
          <span class="chip" data-intro="eyebrow">My orders</span>
          <h1 data-hero-headline>Your <em>orders</em></h1>
          <p class="sub" data-intro="sub" data-lede>Every order you have placed with us. Pick one to follow it home or see what was in the box.</p>
          <div class="sb-tabs" data-intro="cta"><a class="sb-tab is-on" href="./orders.html" aria-current="page">My orders</a><a class="sb-tab" href="#" data-auth data-go="./subscriptions.html" data-plain>My subscriptions</a></div>
          <div class="od-stats" data-intro="cta" data-stats></div>
        </div>
      </section>

      <section class="sec od-sec">
        <div class="container">
          <div class="od-filters" role="tablist" aria-label="Filter orders" data-filters>
            <button type="button" role="tab" class="od-f" data-f="all" aria-selected="true">All <b data-n="all">0</b></button>
            <button type="button" role="tab" class="od-f" data-f="active" aria-selected="false">On the way <b data-n="active">0</b></button>
            <button type="button" role="tab" class="od-f" data-f="done" aria-selected="false">Delivered <b data-n="done">0</b></button>
          </div>
          <div class="od-list" data-list aria-live="polite"></div>
          <div class="od-empty" data-empty hidden>
            <div class="od-empty-art" aria-hidden="true"><img src="./media/box.webp" alt="" width="220" height="220"></div>
            <h2 data-empty-title>No orders yet</h2>
            <p data-empty-text>When you place an order it shows up here, ready to track.</p>
            <a class="pill solid" href="#" data-auth data-go="./shop.html" data-plain>Start shopping</a>
          </div>
        </div>
      </section>
    </div>

    <!-- one order: tracking or details -->
    <div data-view="order" hidden>
      <section class="sub-hero od-hero od-hero-sm">
        <div class="container">
          <a class="od-back" href="#" data-back><span aria-hidden="true">&larr;</span> All orders</a>
          <div class="od-head">
            <div>
              <span class="chip" data-o-chip>Order</span>
              <h1 data-o-title>PP-1000</h1>
              <p class="sub" data-o-sub></p>
            </div>
            <span class="st" data-o-status></span>
          </div>
        </div>
      </section>
      <section class="sec od-sec">
        <div class="container" data-o-body></div>
      </section>
    </div>
  </main>
</body>
</html>
